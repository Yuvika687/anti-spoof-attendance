<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liveness Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/vendor/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">

  <header class="app-header">
    <div class="container app-header-row">
      <div class="app-title"><span class="dot">&#9679;</span> Liveness Gate</div>
      <div class="model-pill" id="model-pill">loading model info&hellip;</div>
      <div class="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">connecting&hellip;</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-view="live">Live</button>
        <button class="tab-btn" data-view="results">Results</button>
        <button class="tab-btn" data-view="robustness">Robustness</button>
        <button class="tab-btn" data-view="models">Models</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="view active" id="view-live"></section>
    <section class="view" id="view-results"></section>
    <section class="view" id="view-robustness"></section>
    <section class="view" id="view-models"></section>
  </main>

</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-box" id="modal-box"></div>
</div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
